<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Ghita Hajjari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li> 
            <li><a href="projects.html">Projects</a></li> 
            <li><a href="music.html">Music</a></li> 
            <!-- Class Step 1: the contact link -->
            <li><a href="contact.html" class="current">Contact</a></li> 
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav>
    <header>
        <img src="images/me.jpg" alt="Ocean picture taken by Ghita Hajjari" class="portrait">
        <div>
            <h1>Contact</h1>
            <p>Questions about my coursework, my projects, or my education path.</p>
        </div>
    </header>

    <main>
        <!-- Class 16: Step 2: a form -->
         <form id="contact-form">
            <p>
                <label for="name">Your name</label>
                <input id="name" name="name" type="text" required>
            </p>

            <p>
               <label for="email">Your email</label>
               <input id="email" email="email" type="email" required> 
            </p>

            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </p>

            <button type="submit">Send</button>
         </form>

         <p id="form-status" role="status"></p>
    </main>

    <footer>
        <p>© <span id="year"></span> Ghita Hajjari</p>
        <a href="https://github.com/ghitahajjari" target="_blank" rel="noopener">GitHub</a>
        <button id="back-to-top">Back to Top</button>
    </footer>

</body>

</html>
